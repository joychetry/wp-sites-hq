# Licence and source audit of every Rust dependency: cargo deny check
# Monks Central is GPL-3.0-or-later, so GPL-compatible permissive and weak
# copyleft licences are fine. AGPL is never allowed (plan D1).

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Reported, not failing: many come from Tauri's GTK 3 stack, which has no
# maintained replacement yet. Read them before each release.
unmaintained = "workspace"

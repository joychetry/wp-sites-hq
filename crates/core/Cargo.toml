[package]
name = "monks-core"
description = "Monks Central core: store, vault, network, core lock and local socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
keyring-core = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
zeroize = "1"

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
tempfile = "3"
tokio-rustls = "0.26"

# Keychain stores, one per OS, features pinned. keyring-core has no fallback
# store: a missing store is an error, never a silent in-memory mock.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

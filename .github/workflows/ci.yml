name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS and Windows minutes cost more on a private repo: nightly and on demand.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Sidecar (the app bundles the wpshq command)
        shell: bash
        run: scripts/sidecar.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x scripts/*.sh
      - run: bash scripts/test-sites.test.sh
      - run: bash scripts/latest-json.test.sh
      - name: Licence headers
        run: bash scripts/check-headers.sh

  licences:
    name: Licences (no AGPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: ui
      - run: bash scripts/licence-audit.sh

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Test
        run: npm test
      - name: Accessibility (axe, keyboard, zoom)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

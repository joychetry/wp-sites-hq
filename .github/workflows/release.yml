name: Release

# A version tag (v0.2.0) builds installers on all three systems and puts them
# in a draft GitHub release; one last job adds latest.json for the in-app
# updater, from every build's .sig file (one writer, so no upload race). Nothing
# is published until a person publishes the draft. Needs the repo secret
# TAURI_SIGNING_PRIVATE_KEY (the updater key; its password, if any, in
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD). See docs/release/checklist.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}
  NOTES: Installers for macOS, Windows and Linux. How to install and open them, see docs/install.md.

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      # A normal release, not a pre-release: the updater reads
      # releases/latest, and GitHub's "latest" skips pre-releases.
      - id: draft
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "WP Sites HQ $TAG" --notes "$NOTES"
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  installers:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage, deb, rpm)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple silicon (dmg)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel (dmg)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (msi, setup exe)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: bash scripts/bundle.sh
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: false

  latest-json:
    name: latest.json for the updater
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          # The app shows "notes" under What's new: the tag's CHANGELOG section.
          notes=$(scripts/changelog-notes.sh "${TAG#v}")
          scripts/latest-json.sh sigs "${TAG#v}" \
            "https://github.com/$GH_REPO/releases/download/$TAG" "$notes" > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
